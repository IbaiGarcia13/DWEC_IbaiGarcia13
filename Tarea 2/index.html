<!DOCTYPE html>
<html lang="es-ES">
    <head>
        <meta charset="UTF-8" />
        <title>Tabla de dividir</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="js/tablaMultiplicar.js" defer></script>
    </head>
    <body>
        <h1>Tabla de dividir</h1>
        <form onsubmit="mostrarTabla(event)">
            <label for="numero">Introduce el número:</label>
            <input id="numero" name="numero" type="number" step="any" required />
            <button type="submit">Mostrar tabla</button>
        </form>
        <div id="tabla" aria-live="polite"></div>
    </body>
</html>
